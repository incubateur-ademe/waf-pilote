name: waf-lint
on:
  pull_request:
    paths: ["waf/**"]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: incubateur-ademe/waf-base/lint@bb2f504999056323d268b17ae7528e714f0c697e # main au 2026-11-13, image v1.2
